name: API DevSecOps

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  CRITICAL_THRESHOLD: 0
  HIGH_THRESHOLD: 0
  MEDIUM_THRESHOLD: 0
  LOW_THRESHOLD: 999999

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check secure tests
      - name: Unit and security tests
        run: mkdir -p reports && pytest --junitxml=reports/security-tests.xml --cov=secure --cov-report=json:reports/coverage.json
      - name: SAST
        run: semgrep --config p/python --json --output reports/sast.json secure vulnerable
      - name: SCA
        run: pip install pip-audit && pip-audit -r requirements.txt -f json -o reports/sca.json
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --no-banner --redact --report-format=json --report-path=/repo/reports/secrets.json
      - name: Build image
        run: docker build -t api-security-testing-pipeline:${{ github.sha }} .
      - name: Container scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" aquasec/trivy:0.70.0 image --format json --output /reports/container.json --severity CRITICAL,HIGH,MEDIUM,LOW --ignore-unfixed api-security-testing-pipeline:${{ github.sha }}
      - name: Start test API
        run: docker run -d --name api-test -p 127.0.0.1:8000:8000 api-security-testing-pipeline:${{ github.sha }}
      - name: OWASP ZAP baseline
        run: docker run --network host --rm -v "$PWD/reports:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://127.0.0.1:8000 -J zap.json -r zap.html || true
      - name: Security gate
        run: python scripts/security_gate.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: reports/
